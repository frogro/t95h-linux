name: Build experimental T95H LibreELEC SD and eMMC
on:
  workflow_dispatch:
    inputs:
      resume_run:
        description: Optional run ID of a saved checkpoint (same commit)
        type: string
        default: ''
      resume_checkpoint:
        description: Checkpoint artifact name from that run
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: t95h-libreelec-base-B
  cancel-in-progress: false
jobs:
  phase1:
    uses: ./.github/workflows/libreelec-phase.yml
    with:
      phase: 1
      resume_run: ${{ inputs.resume_run }}
      checkpoint: ${{ inputs.resume_checkpoint }}
  phase2:
    needs: phase1
    if: needs.phase1.outputs.state == 'paused'
    uses: ./.github/workflows/libreelec-phase.yml
    with:
      phase: 2
      checkpoint: libreelec-checkpoint-1
  phase3:
    needs: phase2
    if: needs.phase2.outputs.state == 'paused'
    uses: ./.github/workflows/libreelec-phase.yml
    with:
      phase: 3
      checkpoint: libreelec-checkpoint-2
  incomplete:
    needs: phase3
    if: needs.phase3.outputs.state == 'paused'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Build state preserved as libreelec-checkpoint-3. Dispatch the same commit with resume_run and resume_checkpoint to continue.'
          exit 1
