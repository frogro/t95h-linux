name: Publish completed LibreELEC images
on:
  workflow_run:
    workflows: [Build experimental T95H LibreELEC SD and eMMC]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful LibreELEC build with completed candidate images
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: t95h-libreelec-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and publish verified completed images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id }}
        run: python3 tools/libreelec/publish.py --source-run "$SOURCE_RUN"
